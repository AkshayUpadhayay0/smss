<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest">
  <title>SMSS login background</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F1FD"/>
      <stop offset="0.55" stop-color="#F8F7FC"/>
      <stop offset="1" stop-color="#EFEBFB"/>
    </linearGradient>

    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C6CF0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5B4BDB" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5B4BDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C58CF5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C58CF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#6C5CE7" fill-opacity="0.16"/>
    </pattern>

    <linearGradient id="dotsFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotsMask">
      <rect width="1920" height="1080" fill="url(#dotsFade)"/>
    </mask>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- Soft colour blobs -->
  <circle cx="260" cy="170" r="560" fill="url(#blobViolet)"/>
  <circle cx="1720" cy="930" r="620" fill="url(#blobIndigo)"/>
  <circle cx="1620" cy="120" r="420" fill="url(#blobPink)"/>
  <circle cx="200" cy="960" r="440" fill="url(#blobBlue)"/>

  <!-- Dot grid, fading downward -->
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dotsMask)"/>

  <!-- Concentric rings, top-right -->
  <g fill="none" stroke="url(#ringStroke)" stroke-width="1.5">
    <circle cx="1760" cy="180" r="140"/>
    <circle cx="1760" cy="180" r="230"/>
    <circle cx="1760" cy="180" r="320"/>
    <circle cx="1760" cy="180" r="410"/>
  </g>

  <!-- Concentric rings, bottom-left -->
  <g fill="none" stroke="url(#ringStroke)" stroke-width="1.5">
    <circle cx="150" cy="930" r="120"/>
    <circle cx="150" cy="930" r="210"/>
    <circle cx="150" cy="930" r="300"/>
  </g>

  <!-- Floating glass tiles (book / notebook feel) -->
  <g filter="url(#soft)">
    <rect x="1380" y="640" width="210" height="140" rx="26" fill="url(#cardFill)" stroke="#6C5CE7" stroke-opacity="0.14" transform="rotate(-12 1485 710)"/>
    <rect x="1500" y="720" width="150" height="100" rx="22" fill="url(#cardFill)" stroke="#6C5CE7" stroke-opacity="0.12" transform="rotate(8 1575 770)"/>
    <rect x="230" y="260" width="190" height="124" rx="24" fill="url(#cardFill)" stroke="#6C5CE7" stroke-opacity="0.14" transform="rotate(10 325 322)"/>
    <rect x="130" y="360" width="130" height="90" rx="20" fill="url(#cardFill)" stroke="#6C5CE7" stroke-opacity="0.12" transform="rotate(-8 195 405)"/>
  </g>

  <!-- Subtle accent lines on tiles -->
  <g stroke="#6C5CE7" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M1420 690 L1520 668" transform="rotate(-12 1485 710)"/>
    <path d="M1420 716 L1500 699" transform="rotate(-12 1485 710)"/>
    <path d="M268 312 L368 330" transform="rotate(10 325 322)"/>
    <path d="M268 338 L348 352" transform="rotate(10 325 322)"/>
  </g>

  <!-- Small sparkle accents -->
  <g fill="#6C5CE7" fill-opacity="0.22">
    <circle cx="520" cy="140" r="5"/>
    <circle cx="1240" cy="90" r="4"/>
    <circle cx="1100" cy="960" r="5"/>
    <circle cx="700" cy="1000" r="4"/>
    <circle cx="1840" cy="560" r="5"/>
    <circle cx="90" cy="600" r="4"/>
  </g>
  <g stroke="#6C5CE7" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round">
    <path d="M900 120 v18 M891 129 h18"/>
    <path d="M1560 440 v18 M1551 449 h18"/>
    <path d="M380 800 v18 M371 809 h18"/>
  </g>

  <!-- Wavy lower band for depth -->
  <path d="M0 900 C 320 840, 560 980, 900 930 S 1500 840, 1920 920 L1920 1080 L0 1080 Z" fill="#6C5CE7" fill-opacity="0.045"/>
  <path d="M0 960 C 360 910, 640 1030, 1000 990 S 1560 920, 1920 985 L1920 1080 L0 1080 Z" fill="#6C5CE7" fill-opacity="0.05"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
