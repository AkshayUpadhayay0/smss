<label class="switch-row" [class.is-disabled]="disabledState()">
  <button
    type="button"
    role="switch"
    [id]="switchId"
    [attr.aria-checked]="checked()"
    class="switch-track"
    [class.is-checked]="checked()"
    [disabled]="disabledState()"
    (click)="toggle()"
  >
    <span class="switch-thumb"></span>
  </button>
  @if (label()) {
    <span class="switch-label">{{ label() }}</span>
  }
</label>
