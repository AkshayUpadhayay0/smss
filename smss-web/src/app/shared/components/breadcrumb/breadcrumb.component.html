<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    @for (item of items(); track item.label; let last = $last; let first = $first) {
      <li>
        @if (first) {
          <app-icon name="home" [size]="14" class="breadcrumb-home-icon"></app-icon>
        }
        @if (item.url && !last) {
          <a [routerLink]="item.url">{{ item.label }}</a>
        } @else {
          <span class="breadcrumb-current" [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
        }
        @if (!last) {
          <span class="breadcrumb-separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
