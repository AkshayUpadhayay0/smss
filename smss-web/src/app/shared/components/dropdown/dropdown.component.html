<div class="app-dropdown">
  <div class="app-dropdown-trigger" (click)="toggle()">
    <ng-content select="[dropdown-trigger]"></ng-content>
  </div>
  @if (isOpen()) {
    <div class="app-dropdown-menu" [class.align-left]="align() === 'left'" (click)="close()">
      <ng-content select="[dropdown-menu]"></ng-content>
    </div>
  }
</div>
