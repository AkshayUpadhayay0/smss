<div class="theme-selector-grid">
  @for (theme of themeService.themes; track theme.name) {
    <button
      type="button"
      class="theme-option"
      [class.is-selected]="theme.name === selected()"
      (click)="select(theme.name)"
    >
      @if (theme.name === selected()) {
        <span class="theme-option-check">
          <app-icon name="check" [size]="12"></app-icon>
        </span>
      }
      <span class="theme-option-swatches">
        @for (color of theme.swatches; track color) {
          <span class="swatch" [style.background]="color"></span>
        }
      </span>
      <span class="theme-option-label">{{ theme.label }}</span>
    </button>
  }
</div>
