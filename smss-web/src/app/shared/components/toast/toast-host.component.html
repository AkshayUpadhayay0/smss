<div class="toast-host" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast-item"
      [class.is-success]="toast.variant === 'success'"
      [class.is-warning]="toast.variant === 'warning'"
      [class.is-danger]="toast.variant === 'danger'"
      [class.is-info]="toast.variant === 'info'"
      role="status"
    >
      <app-icon [name]="iconFor(toast.variant)" [size]="18"></app-icon>
      <div class="toast-body">
        <p class="toast-title">{{ toast.title }}</p>
        @if (toast.message) {
          <p class="toast-message">{{ toast.message }}</p>
        }
      </div>
      <button type="button" class="toast-close" (click)="dismiss(toast.id)" aria-label="Dismiss notification">
        <app-icon name="x" [size]="14"></app-icon>
      </button>
    </div>
  }
</div>
