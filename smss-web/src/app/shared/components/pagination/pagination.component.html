<div class="pagination-bar">
  <div class="pagination-info">
    Showing {{ rangeStart() }}–{{ rangeEnd() }} of {{ totalItems() }}
    <label class="page-size-select">
      Items per page:
      <select (change)="onPageSizeSelect($event)">
        @for (size of pageSizeOptions(); track size) {
          <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
        }
      </select>
    </label>
  </div>

  <nav class="pagination-controls" aria-label="Pagination">
    <button type="button" class="page-btn" [disabled]="currentPage() === 1" (click)="goTo(1)" aria-label="First page">
      <app-icon name="chevrons-left" [size]="14"></app-icon>
    </button>
    <button type="button" class="page-btn" [disabled]="currentPage() === 1" (click)="goTo(currentPage() - 1)">
      Previous
    </button>

    @if (visiblePages()[0] > 1) {
      <span class="page-ellipsis">…</span>
    }
    @for (page of visiblePages(); track page) {
      <button type="button" class="page-btn" [class.is-active]="page === currentPage()" (click)="goTo(page)">
        {{ page }}
      </button>
    }
    @if (visiblePages()[visiblePages().length - 1] < totalPages()) {
      <span class="page-ellipsis">…</span>
    }

    <button type="button" class="page-btn" [disabled]="currentPage() === totalPages()" (click)="goTo(currentPage() + 1)">
      Next
    </button>
    <button type="button" class="page-btn" [disabled]="currentPage() === totalPages()" (click)="goTo(totalPages())" aria-label="Last page">
      <app-icon name="chevrons-right" [size]="14"></app-icon>
    </button>
  </nav>
</div>
