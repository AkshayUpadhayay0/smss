<div class="app-tabs">
  <div class="app-tabs-list" role="tablist">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        role="tab"
        class="app-tab-btn"
        [class.is-active]="tab.id === active"
        [attr.aria-selected]="tab.id === active"
        (click)="select(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>
</div>
