<div class="main-layout">
  <app-sidebar
    [collapsed]="collapsed()"
    [mobileOpen]="mobileOpen()"
    (closeMobile)="closeMobileSidebar()"
  ></app-sidebar>

  <div class="main-layout-content" [class.is-collapsed]="collapsed()">
    <app-header (toggleSidebar)="toggleSidebar()" (toggleMobileSidebar)="toggleMobileSidebar()"></app-header>
    <main class="main-layout-body">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
