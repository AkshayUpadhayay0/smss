<header class="app-header">
  <div class="header-left">
    <button type="button" class="icon-btn toggle-mobile" (click)="toggleMobileSidebar.emit()" aria-label="Open menu">
      <app-icon name="menu" [size]="20"></app-icon>
    </button>
    <button type="button" class="icon-btn toggle-desktop" (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
      <app-icon name="menu" [size]="20"></app-icon>
    </button>

    @if (authService.currentOrganization(); as org) {
      <div class="header-org">
        <div class="header-org-logo">{{ org.name.charAt(0) }}</div>
        <div class="header-org-text">
          <span class="header-org-name">{{ org.name }}</span>
          <span class="header-org-code hide-mobile">{{ org.code }}</span>
        </div>
      </div>
    }
  </div>

  <div class="header-right">
    <button type="button" class="icon-btn hide-mobile" aria-label="Search">
      <app-icon name="search" [size]="18"></app-icon>
    </button>
    <button type="button" class="icon-btn" aria-label="Notifications">
      <app-icon name="bell" [size]="18"></app-icon>
      <span class="notification-dot"></span>
    </button>

    @if (authService.currentUser(); as user) {
      <app-dropdown align="right">
        <button type="button" class="user-trigger" dropdown-trigger>
          <app-avatar [name]="user.fullName" size="sm"></app-avatar>
          <span class="user-trigger-text hide-mobile">
            <span class="user-name">{{ user.fullName }}</span>
            <span class="user-role">{{ user.role }}</span>
          </span>
          <app-icon name="chevron-down" [size]="14" class="hide-mobile"></app-icon>
        </button>
        <div dropdown-menu>
          <button type="button" class="dropdown-item">
            <app-icon name="user-circle" [size]="16"></app-icon>
            Profile
          </button>
          <button type="button" class="dropdown-item">
            <app-icon name="settings" [size]="16"></app-icon>
            Settings
          </button>
          <button type="button" class="dropdown-item" (click)="goToChangePassword()">
            <app-icon name="key-round" [size]="16"></app-icon>
            Change Password
          </button>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item is-danger" (click)="logout()">
            <app-icon name="log-out" [size]="16"></app-icon>
            Logout
          </button>
        </div>
      </app-dropdown>
    }
  </div>
</header>
