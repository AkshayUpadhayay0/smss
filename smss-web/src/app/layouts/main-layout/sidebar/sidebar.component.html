<div class="brand">
  <app-logo [showText]="!collapsed()" />
</div>

<nav class="nav" aria-label="Main navigation">
  @for (item of items; track item.label) {
    @if (item.children) {
      <div class="group" [class.open]="isOpen(item)">
        <button type="button" class="link group-toggle" [attr.aria-expanded]="isOpen(item)" [title]="collapsed() ? item.label : ''" (click)="toggleGroup(item)">
          <app-icon [name]="item.icon" [size]="20" />
          <span class="label">{{ item.label }}</span>
          <app-icon class="chevron" name="chevron-down" [size]="16" />
        </button>
        @if (isOpen(item) && !collapsed()) {
          <div class="children">
            @for (child of item.children; track child.route) {
              <a class="link child" [routerLink]="child.route" routerLinkActive="active" (click)="navigated.emit()">
                <span class="dot"></span>
                <span class="label">{{ child.label }}</span>
              </a>
            }
          </div>
        }
      </div>
    } @else {
      <a class="link" [routerLink]="item.route" routerLinkActive="active" [title]="collapsed() ? item.label : ''" (click)="navigated.emit()">
        <app-icon [name]="item.icon" [size]="20" />
        <span class="label">{{ item.label }}</span>
      </a>
    }
  }
</nav>
