@if (mobileOpen()) {
  <div class="sidebar-overlay" (click)="closeMobile.emit()"></div>
}

<aside class="app-sidebar" [class.is-collapsed]="collapsed()" [class.is-mobile-open]="mobileOpen()">
  <div class="sidebar-brand">
    <div class="sidebar-brand-logo">
      <app-icon name="graduation-cap" [size]="20"></app-icon>
    </div>
    @if (!collapsed()) {
      <span class="sidebar-brand-name">smss-web</span>
    }
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.label) {
      @if (item.children) {
        <div class="sidebar-group">
          <button type="button" class="sidebar-group-toggle" (click)="toggleGroup(item.label)">
            <app-icon [name]="item.icon" [size]="18"></app-icon>
            @if (!collapsed()) {
              <span class="sidebar-label">{{ item.label }}</span>
              <app-icon
                name="chevron-down"
                [size]="14"
                class="sidebar-chevron"
                [class.is-open]="isExpanded(item.label)"
              ></app-icon>
            }
          </button>
          @if (isExpanded(item.label) && !collapsed()) {
            <div class="sidebar-children">
              @for (child of item.children; track child.route) {
                <a
                  [routerLink]="child.route"
                  routerLinkActive="is-active"
                  class="sidebar-child-link"
                  (click)="onLinkClick()"
                >
                  <app-icon [name]="child.icon || 'circle'" [size]="15"></app-icon>
                  <span>{{ child.label }}</span>
                </a>
              }
            </div>
          }
        </div>
      } @else {
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="sidebar-link"
          (click)="onLinkClick()"
        >
          <app-icon [name]="item.icon" [size]="18"></app-icon>
          @if (!collapsed()) {
            <span class="sidebar-label">{{ item.label }}</span>
          }
        </a>
      }
    }
  </nav>
</aside>
