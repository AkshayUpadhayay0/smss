<app-page-header title="Concessions given" subtitle="Every discount given when collecting a payment: who, why and how much" icon="file-text" [breadcrumbs]="breadcrumbs" />

<app-card>
  <form class="filters" (submit)="$event.preventDefault(); apply()" aria-label="Date range">
    <app-input label="From" type="date" [formControl]="fromControl" />
    <app-input label="To" type="date" [formControl]="toControl" [errorText]="rangeError()" />
    <div class="filter-actions">
      <app-button type="submit" [disabled]="!!rangeError() || loading()"><app-icon name="search" [size]="16" />Show</app-button>
      <app-button variant="secondary" [disabled]="loading()" (click)="clearDates()">All dates</app-button>
    </div>
  </form>
</app-card>

<app-card [noPadding]="true">
  <div class="toolbar">
    <span class="count">
      {{ total() }} {{ total() === 1 ? 'payment' : 'payments' }}
      <span class="chip" aria-label="Total given, voided payments excluded">Total given {{ inr(totalAmount()) }}</span>
    </span>
    <app-button variant="secondary" size="sm" [disabled]="exporting() || total() === 0" (click)="exportCsv()">
      <app-icon name="file-text" [size]="14" />{{ exporting() ? 'Preparing…' : 'Export CSV' }}
    </app-button>
  </div>

  <app-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [emptyMessage]="failed() ? 'Could not load the concessions given.' : 'No concessions were given in this period.'"
  />

  @if (failed()) {
    <div class="retry"><app-button variant="secondary" size="sm" (click)="load()">Try again</app-button></div>
  }

  <app-pagination [currentPage]="page()" [totalItems]="total()" [pageSize]="pageSize()" (pageChange)="onPage($event)" (pageSizeChange)="onPageSize($event)" />
  <p class="note">Read-only. A voided payment stays in this list as the audit trail but is not counted in the total.</p>
</app-card>
