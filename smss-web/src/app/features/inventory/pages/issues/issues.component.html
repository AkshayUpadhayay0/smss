<app-page-header title="Issue / Return" subtitle="Hand items to staff, students or departments, and take them back" icon="send" [breadcrumbs]="breadcrumbs">
  @if (canManage()) {
    <app-button (click)="creating.set(true)"><app-icon name="plus" [size]="16" />Issue items</app-button>
  }
</app-page-header>

<app-inventory-tabs />

<app-card [noPadding]="true">
  <form class="filters" (submit)="$event.preventDefault(); apply()" aria-label="Filter issues">
    <app-input label="Issue number" prefixIcon="search" placeholder="e.g. ISS-2026-0001" [formControl]="search" />
    <app-select label="Status" [options]="statusFilter" [formControl]="status" />
    <app-select label="Issued to" [options]="typeFilter" [formControl]="type" />
    <app-input label="From" type="date" [formControl]="from" />
    <app-input label="To" type="date" [formControl]="to" />
    <app-button type="submit" variant="secondary" [disabled]="loading()"><app-icon name="search" [size]="16" />Show</app-button>
  </form>
  <div class="toolbar"><span class="count">{{ total() }} {{ total() === 1 ? 'issue' : 'issues' }}</span></div>

  <app-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [hasActions]="true"
    [emptyMessage]="failed() ? 'Could not load the issues.' : 'Nothing has been issued yet.'"
  >
    <ng-template #rowActions let-row>
      <app-button variant="secondary" size="sm" (click)="openId.set(row.issueId)"><app-icon name="eye" [size]="14" />{{ canManage() ? 'Open' : 'View' }}</app-button>
    </ng-template>
  </app-table>

  @if (failed()) {
    <div class="retry"><app-button variant="secondary" size="sm" (click)="load()">Try again</app-button></div>
  }
  <app-pagination [currentPage]="page()" [totalItems]="total()" [pageSize]="pageSize()" (pageChange)="onPage($event)" (pageSizeChange)="onPageSize($event)" />
</app-card>

@if (creating()) {
  <app-issue-form-modal (saved)="onIssued($event)" (closed)="creating.set(false)" />
}

@if (openId(); as id) {
  <app-issue-detail-modal [issueId]="id" [canManage]="canManage()" (changed)="load()" (closed)="openId.set(null)" />
}
