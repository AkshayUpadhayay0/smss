<app-page-header title="Items / Categories" subtitle="Everything the school store keeps, and how it is grouped" icon="layers" [breadcrumbs]="breadcrumbs">
  @if (canManage() && view() === 'items') {
    <app-button (click)="form.set({ item: null })"><app-icon name="plus" [size]="16" />Add Item</app-button>
  }
</app-page-header>

<app-inventory-tabs />

<div class="segmented" role="tablist" aria-label="Items or categories">
  <button type="button" role="tab" [attr.aria-selected]="view() === 'items'" [class.active]="view() === 'items'" (click)="view.set('items')">Items</button>
  <button type="button" role="tab" [attr.aria-selected]="view() === 'categories'" [class.active]="view() === 'categories'" (click)="view.set('categories')">Categories</button>
</div>

@if (view() === 'items') {
  <app-card [noPadding]="true">
    <div class="filters" role="search">
      <app-input label="Search" prefixIcon="search" placeholder="Name, code or barcode…" [formControl]="search" />
      <app-select label="Category" [options]="categoryOptions()" [formControl]="category" />
      <app-select label="Status" [options]="statusOptions" [formControl]="status" />
      <app-select label="Stock level" [options]="stockOptions" [formControl]="stock" />
    </div>
    <div class="toolbar"><span class="count">{{ total() }} {{ total() === 1 ? 'item' : 'items' }}</span></div>

    <app-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [hasActions]="true"
      [emptyMessage]="failed() ? 'Could not load the items.' : 'No items match. Add an item, or change the filters.'"
    >
      <ng-template #rowActions let-row>
        <span class="row-actions">
          <app-button variant="secondary" size="sm" aria-label="Stock history" title="Stock history" (click)="openHistory(row)"><app-icon name="eye" [size]="14" /></app-button>
          @if (canManage()) {
            <app-button variant="secondary" size="sm" aria-label="Edit" title="Edit" (click)="openEdit(row)"><app-icon name="pencil" [size]="14" /></app-button>
            @if (row.isActive) {
              <app-button variant="danger-ghost" size="sm" [disabled]="busyId() === row.itemId" (click)="toggle(row)"><app-icon name="toggle-left" [size]="14" />Deactivate</app-button>
            } @else {
              <app-button variant="secondary" size="sm" [disabled]="busyId() === row.itemId" (click)="toggle(row)"><app-icon name="toggle-right" [size]="14" />Activate</app-button>
            }
          }
        </span>
      </ng-template>
    </app-table>

    @if (failed()) {
      <div class="retry"><app-button variant="secondary" size="sm" (click)="load()">Try again</app-button></div>
    }

    <app-pagination [currentPage]="page()" [totalItems]="total()" [pageSize]="pageSize()" (pageChange)="onPage($event)" (pageSizeChange)="onPageSize($event)" />
  </app-card>
} @else {
  <app-categories-panel (changed)="onCategoriesChanged($event)" />
}

@if (form(); as f) {
  <app-item-form-modal [item]="f.item" [categories]="categories()" [units]="units()" (saved)="onSaved()" (photoChanged)="onPhotoChanged($event)" (closed)="form.set(null)" />
}

@if (history(); as h) {
  <app-item-history-modal [item]="h" (closed)="history.set(null)" />
}
