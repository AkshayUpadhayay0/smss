<app-page-header title="Schools" subtitle="Registered Schools list." icon="table-2"
  [breadcrumbs]="[{ label: 'Home', url: '/dashboard' }, { label: 'Schools' }]">
  <app-button variant="secondary" (pressed)="loadSchools()">
    <app-icon name="refresh-cw" [size]="16"></app-icon>
    Refresh
  </app-button>
  <app-button variant="primary" routerLink="/schools/add">
    <app-icon name="circle-plus" [size]="16"></app-icon>
    Add School
  </app-button>
</app-page-header>

<app-card [noPadding]="true">
  <div class="table-toolbar">
    <div class="table-search">
      <app-icon name="search" [size]="16" class="table-search-icon"></app-icon>
      <input
        type="search"
        class="form-control"
        placeholder="Search by school code, name, email, mobile or status…"
        [value]="searchTerm()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>
    <div class="table-toolbar-meta">
      <app-icon name="rows-3" [size]="15"></app-icon>
      {{ filteredRows().length }} records
    </div>
  </div>

  <app-table
    [columns]="columns"
    [rows]="pagedRows()"
    [loading]="loading()"
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    [hasActions]="true"
    emptyMessage="Register a school to see it here."
    (sortChange)="onSortChange($event)"
  >
    <ng-template #rowActions let-row>
      <div class="row-actions">
        <button type="button" class="icon-btn" (click)="view(row)" aria-label="View">
          <app-icon name="eye" [size]="16"></app-icon>
        </button>
        <button type="button" class="icon-btn" (click)="edit(row)" aria-label="Edit">
          <app-icon name="pencil" [size]="16"></app-icon>
        </button>
        <button
          type="button"
          class="icon-btn"
          [class.is-danger]="isActive(row)"
          (click)="toggleStatus(row)"
          [attr.aria-label]="statusActionLabel(row)"
          [title]="statusActionLabel(row)"
        >
          <app-icon [name]="statusActionIcon(row)" [size]="16"></app-icon>
        </button>
      </div>
    </ng-template>
  </app-table>

  <div class="table-footer">
    <app-pagination
      [currentPage]="currentPage()"
      [totalItems]="filteredRows().length"
      [pageSize]="pageSize()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    ></app-pagination>
  </div>
</app-card>
