<app-page-header title="Admissions" subtitle="Admission applications and where each one stands" icon="user" [breadcrumbs]="breadcrumbs">
  <app-button (click)="newApplication()"><app-icon name="plus" [size]="16" />New Application</app-button>
</app-page-header>

<app-card [noPadding]="true">
  <div class="toolbar">
    <div class="search">
      <app-input placeholder="Search by number, name, class…" prefixIcon="search" (input)="onSearch($event)" />
    </div>
    <div class="filter">
      <app-select placeholder="All statuses" [options]="statusOptions" [formControl]="statusControl" />
    </div>
    <div class="filter">
      <app-select placeholder="All classes" [options]="classOptions()" [formControl]="classControl" />
    </div>
    <div class="filter">
      <app-select placeholder="All years" [options]="yearOptions()" [formControl]="yearControl" />
    </div>
    <span class="count">{{ total() }} {{ total() === 1 ? 'application' : 'applications' }}</span>
  </div>

  <app-table
    [columns]="columns"
    [rows]="pageRows()"
    [loading]="loading()"
    [hasActions]="true"
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    [emptyMessage]="loadFailed() ? 'Could not load applications.' : search() || statusFilter() || classFilter() || yearFilter() ? 'Nothing matches your filters.' : 'No applications yet. Click New Application to add the first one.'"
    (sortChange)="onSort($event)"
  >
    <ng-template #rowActions let-row>
      <app-button variant="secondary" size="sm" aria-label="View" title="View" (click)="view(row)">
        <app-icon name="eye" [size]="14" />View
      </app-button>
      <app-admission-actions [admission]="admissionOf(row)" (changed)="onChanged($event)" />
    </ng-template>
  </app-table>

  @if (loadFailed()) {
    <div class="retry"><app-button variant="secondary" size="sm" (click)="load()">Try again</app-button></div>
  }

  <app-pagination
    [currentPage]="page()"
    [totalItems]="total()"
    [pageSize]="pageSize()"
    (pageChange)="page.set($event)"
    (pageSizeChange)="onPageSize($event)"
  />
</app-card>
