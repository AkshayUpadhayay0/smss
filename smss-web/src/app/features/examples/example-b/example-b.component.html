<app-page-header
  title="Example B"
  subtitle="Level 2 — breadcrumb now shows two segments below Home."
  icon="rows-3"
  [breadcrumbs]="[{ label: 'Home', url: '/dashboard' }, { label: 'Examples' }, { label: 'A', url: '/example/a' }, { label: 'B' }]"
>
</app-page-header>

<app-card>
  <p class="text-secondary" style="margin-bottom: 16px;">
    Each level under <code>/example</code> is a real nested Angular route, so the URL, breadcrumb and browser back/forward
    button all stay in sync.
  </p>
  <div style="display: flex; gap: 12px;">
    <app-button variant="secondary" routerLink="/example/a">← Back to A</app-button>
    <app-button variant="primary" routerLink="/example/a/b/c">Go to Level 3 (C) →</app-button>
  </div>
</app-card>
