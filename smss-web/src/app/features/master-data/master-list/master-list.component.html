@if (config) {
  <app-page-header [title]="config.title" [subtitle]="config.subtitle" icon="book-open"
    [breadcrumbs]="[{ label: 'Home', url: '/dashboard' }, { label: 'Masters' }, { label: config.title }]">
    <app-button variant="secondary" (pressed)="load()" [disabled]="loading">
      <app-icon name="refresh-cw" [size]="16"></app-icon>
      Refresh
    </app-button>
    <app-button variant="primary" (pressed)="openAdd()">
      <app-icon name="circle-plus" [size]="16"></app-icon>
      Add {{ config.singular }}
    </app-button>
  </app-page-header>

  <app-card [noPadding]="true">
    <div class="table-toolbar">
      <div class="table-search">
        <app-icon name="search" [size]="16" class="table-search-icon"></app-icon>
        <input type="search" class="form-control" placeholder="Search by code or name…" aria-label="Search"
          [(ngModel)]="search" (ngModelChange)="onFilterChange()" />
      </div>
      <select class="form-control status-filter" aria-label="Filter by status"
        [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()">
        <option value="all">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <div class="table-toolbar-meta">
        <app-icon name="rows-3" [size]="15"></app-icon>
        {{ filtered.length }} records
      </div>
    </div>

    @if (loadError && !loading) {
      <app-empty-state icon="circle-alert" [title]="'Could not load ' + config.title.toLowerCase()"
        [description]="loadError">
        <app-button variant="secondary" size="sm" (pressed)="load()">Retry</app-button>
      </app-empty-state>
    } @else {
      <app-table [columns]="columns" [rows]="paged" [loading]="loading" [hasActions]="true"
        [emptyTitle]="'No ' + config.title.toLowerCase() + ' found'"
        [emptyMessage]="items.length === 0
          ? 'Click &quot;Add ' + config.singular + '&quot; to create the first one.'
          : 'Try changing the search or filter.'">

        <ng-template [appTableCell]="config.keys.code ?? ''" let-row let-value="value">
          <span class="code-chip">{{ value }}</span>
        </ng-template>

        <ng-template appTableCell="description" let-row>
          <span class="desc-cell" [title]="row.description || ''">{{ row.description || '—' }}</span>
        </ng-template>

        <ng-template appTableCell="isActive" let-row>
          <app-badge [variant]="row.isActive ? 'success' : 'neutral'">{{ row.isActive ? 'Active' : 'Inactive' }}</app-badge>
        </ng-template>

        <ng-template #rowActions let-item>
          <div class="row-actions">
            <button type="button" class="icon-btn" (click)="openEdit(item)"
              [attr.aria-label]="'Edit ' + item[config.keys.name]" title="Edit">
              <app-icon name="pencil" [size]="16"></app-icon>
            </button>
            <button type="button" class="icon-btn" [class.is-danger]="item.isActive"
              (click)="toggleStatus(item)"
              [disabled]="(item.isProtected && item.isActive) || togglingId === item[config.keys.id]"
              [attr.aria-label]="(item.isActive ? 'Deactivate ' : 'Activate ') + item[config.keys.name]"
              [title]="item.isProtected && item.isActive
                ? 'System roles cannot be deactivated'
                : (item.isActive ? 'Deactivate' : 'Activate')">
              <app-icon [name]="item.isActive ? 'circle-x' : 'circle-check'" [size]="16"></app-icon>
            </button>
          </div>
        </ng-template>
      </app-table>

      @if (!loading && filtered.length > 0) {
        <div class="table-footer">
          <app-pagination [currentPage]="page" [totalItems]="filtered.length" [pageSize]="pageSize"
            (pageChange)="goTo($event)" (pageSizeChange)="onPageSizeChange($event)"></app-pagination>
        </div>
      }
    }
  </app-card>

  @if (dialogOpen) {
    <app-master-form-dialog [config]="config" [item]="editingItem" [saving]="saving"
      [errorMessage]="dialogError" (save)="onSave($event)" (cancel)="closeDialog()">
    </app-master-form-dialog>
  }
}
