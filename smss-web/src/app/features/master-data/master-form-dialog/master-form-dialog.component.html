<app-modal [open]="true" [title]="dialogTitle" (closed)="cancel.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage) {
      <app-alert variant="danger" class="dialog-alert">{{ errorMessage }}</app-alert>
    }

    @if (hasCode) {
      <app-input [label]="codeLabel" formControlName="code" [required]="!isEdit" placeholder="e.g. CBSE"
        [help]="isEdit ? 'Code cannot be changed after creation.' : undefined"
        [errorText]="errorFor('code', codeLabel)"></app-input>
    }

    <app-input [label]="config.nameLabel" formControlName="name" [required]="true"
      [errorText]="errorFor('name', config.nameLabel)"></app-input>

    @if (typeField; as t) {
      <app-input [label]="t.label" formControlName="type" [required]="true" [placeholder]="t.placeholder ?? ''"
        [errorText]="errorFor('type', t.label)"></app-input>
    }

    @if (hasDescription) {
      <app-textarea label="Description" formControlName="description" [rows]="3"
        [errorText]="errorFor('description', 'Description')"></app-textarea>
    }

    <div class="dialog-actions">
      <app-button variant="secondary" (pressed)="cancel.emit()" [disabled]="saving">Cancel</app-button>
      <app-button type="submit" variant="primary" [loading]="saving" [disabled]="form.invalid || saving">
        {{ isEdit ? 'Save Changes' : 'Create' }}
      </app-button>
    </div>
  </form>
</app-modal>
