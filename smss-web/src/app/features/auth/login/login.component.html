<div class="heading">
  <h2>Sign in</h2>
  <p class="text-muted">Enter your credentials to access SMSS.</p>
</div>

<form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (errorMessage(); as message) {
    <p class="alert" role="alert"><app-icon name="circle-alert" [size]="16" />{{ message }}</p>
  }

  <app-input label="Username" placeholder="Your username" prefixIcon="user" formControlName="username" [errorText]="fieldError('username')" />
  <app-input label="Password" type="password" placeholder="Your password" prefixIcon="lock" formControlName="password" [errorText]="fieldError('password')" />

  <label class="remember">
    <input type="checkbox" formControlName="rememberMe" />
    Keep me signed in on this device
  </label>

  <app-button type="submit" [block]="true" size="lg" [disabled]="loading()">{{ loading() ? 'Signing in…' : 'Sign in' }}</app-button>
</form>
