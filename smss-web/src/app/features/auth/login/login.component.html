<div class="auth-card">
  <h1 class="auth-title">Sign in</h1>
  <p class="auth-subtitle">Welcome back! Please enter your details.</p>

  @if (errorMessage()) {
    <app-alert variant="danger" style="margin-bottom: 16px;">{{ errorMessage() }}</app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-input
      label="Username"
      type="text"
      formControlName="username"
      [required]="true"
      prefixIcon="user"
      placeholder="Enter your username"
      [errorText]="errorFor('username')"
    ></app-input>

    <app-input
      label="Password"
      type="password"
      formControlName="password"
      [required]="true"
      [showPasswordToggle]="true"
      prefixIcon="lock"
      placeholder="Enter your password"
      [errorText]="errorFor('password')"
    ></app-input>

    <div class="auth-row">
      <app-checkbox label="Remember me" formControlName="rememberMe"></app-checkbox>
    </div>

    <app-button type="submit" variant="primary" [block]="true" [loading]="loading()">Sign In</app-button>
  </form>
</div>
