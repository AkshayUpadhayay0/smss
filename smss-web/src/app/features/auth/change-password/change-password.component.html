<div class="change-password-card">
  <h1 class="title">Change password</h1>
  <p class="subtitle">
    @if (authService.mustChangePassword()) {
      You signed in with a temporary password. Please choose a new one to continue.
    } @else {
      Enter your current password and choose a new one.
    }
  </p>

  @if (errorMessage()) {
    <app-alert variant="danger" style="margin-bottom: 16px;">{{ errorMessage() }}</app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-input
      label="Current password"
      type="password"
      formControlName="currentPassword"
      [required]="true"
      [showPasswordToggle]="true"
      prefixIcon="lock"
      [errorText]="errorFor('currentPassword')"
    ></app-input>

    <app-input
      label="New password"
      type="password"
      formControlName="newPassword"
      [required]="true"
      [showPasswordToggle]="true"
      prefixIcon="key-round"
      help="At least 8 characters."
      [errorText]="errorFor('newPassword')"
    ></app-input>

    <app-input
      label="Confirm new password"
      type="password"
      formControlName="confirmPassword"
      [required]="true"
      [showPasswordToggle]="true"
      prefixIcon="key-round"
      [errorText]="errorFor('confirmPassword')"
    ></app-input>

    <app-button type="submit" variant="primary" [block]="true" [loading]="loading()">Update password</app-button>
  </form>
</div>
