<app-page-header
  title="Change Password"
  [subtitle]="firstLogin ? 'You are using a temporary password. Choose a new one to continue.' : 'Update the password for your account'"
  icon="lock"
  [breadcrumbs]="[{ label: 'Change Password' }]"
/>

<app-card>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-input label="Current password" type="password" [required]="true" prefixIcon="lock" formControlName="currentPassword" [errorText]="error('currentPassword')" />
    <app-input label="New password" type="password" [required]="true" prefixIcon="lock" helpText="At least 8 characters, and different from the current one." formControlName="newPassword" [errorText]="error('newPassword')" />
    <app-input label="Confirm new password" type="password" [required]="true" prefixIcon="lock" formControlName="confirmPassword" [errorText]="error('confirmPassword')" />
    <div class="actions">
      <app-button type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Change password' }}</app-button>
    </div>
  </form>
</app-card>
