<app-page-header
  title="Table"
  subtitle="Reusable data table example — search, sort, paginate."
  icon="table-2"
  [breadcrumbs]="[{ label: 'Home', url: '/dashboard' }, { label: 'Management' }, { label: 'Table' }]"
>
  <app-button variant="secondary" (pressed)="simulateLoading()">
    <app-icon name="refresh-cw" [size]="16"></app-icon>
    Refresh
  </app-button>
  <app-button variant="primary">
    <app-icon name="circle-plus" [size]="16"></app-icon>
    Add User
  </app-button>
</app-page-header>

<app-card [noPadding]="true">
  <div class="table-toolbar">
    <div class="table-search">
      <app-icon name="search" [size]="16" class="table-search-icon"></app-icon>
      <input
        type="search"
        class="form-control"
        placeholder="Search by name, email, organization, role or status…"
        [value]="searchTerm()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>
    <div class="table-toolbar-meta">
      <app-icon name="rows-3" [size]="15"></app-icon>
      {{ filteredRows().length }} records
    </div>
  </div>

  <app-table
    [columns]="columns"
    [rows]="pagedRows()"
    [loading]="loading()"
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    [hasActions]="true"
    emptyMessage="Try adjusting your search terms."
    (sortChange)="onSortChange($event)"
  >
    <ng-template #rowActions let-row>
      <div class="row-actions">
        <button type="button" class="icon-btn" (click)="view(row)" aria-label="View">
          <app-icon name="eye" [size]="16"></app-icon>
        </button>
        <button type="button" class="icon-btn" (click)="edit(row)" aria-label="Edit">
          <app-icon name="pencil" [size]="16"></app-icon>
        </button>
        <button type="button" class="icon-btn is-danger" (click)="remove(row)" aria-label="Delete">
          <app-icon name="trash-2" [size]="16"></app-icon>
        </button>
      </div>
    </ng-template>
  </app-table>

  <div class="table-footer">
    <app-pagination
      [currentPage]="currentPage()"
      [totalItems]="filteredRows().length"
      [pageSize]="pageSize()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    ></app-pagination>
  </div>
</app-card>
