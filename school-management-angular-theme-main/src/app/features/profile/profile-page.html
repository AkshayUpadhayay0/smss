<div class="page-wrap">
  <app-page-header title="My Profile" subtitle="View and update your personal account information." [crumbs]="[{label: 'Dashboard', link: '/dashboard'}, {label: 'Profile'}]" />

  <div class="card card-pad detail-hero" style="margin-bottom: var(--space-6)">
    <app-avatar [src]="auth.currentUser()?.avatar ?? ''" [name]="auth.currentUser()?.name ?? ''" [size]="84" />
    <div style="flex:1; min-width:220px">
      <h2 style="font-size:19px">{{ auth.currentUser()?.name }}</h2>
      <div class="text-secondary text-sm" style="margin-top:2px">{{ auth.currentUser()?.role }} · {{ auth.currentUser()?.email }}</div>
      <button class="btn btn-outline btn-sm" style="margin-top: var(--space-3)"><app-icon name="image" [size]="14" /> Change Photo</button>
    </div>
  </div>

  <div class="card card-pad">
    <app-tabs [items]="tabs" [active]="activeTab()" (select)="activeTab.set($event)" />
    <div style="margin-top: var(--space-6)">
      @switch (activeTab()) {
        @case ('info') {
          <div class="form-grid">
            <div><label class="field-label">Full Name</label><input class="input" [value]="auth.currentUser()?.name" /></div>
            <div><label class="field-label">Email Address</label><input class="input" [value]="auth.currentUser()?.email" /></div>
            <div><label class="field-label">Role</label><input class="input" [value]="auth.currentUser()?.role" disabled /></div>
            <div><label class="field-label">Phone Number</label><input class="input" placeholder="+91 98765 43210" /></div>
            <div style="grid-column:span 2"><label class="field-label">Bio</label><textarea class="textarea" rows="3" placeholder="Tell us a little about yourself…"></textarea></div>
          </div>
          <div class="form-actions"><button class="btn btn-primary"><app-icon name="check" [size]="16" /> Save Changes</button></div>
        }
        @case ('activity') {
          <div class="list-col">
            @for (a of activities; track a.id) {
              <div class="activity-row">
                <div class="activity-icon"><app-icon [name]="a.icon" [size]="14" /></div>
                <div>
                  <div class="text-sm"><b>{{ a.actor }}</b> {{ a.action }}</div>
                  <div class="text-muted text-xs">{{ a.timestamp }}</div>
                </div>
              </div>
            }
          </div>
        }
        @case ('security') {
          <div class="form-grid">
            <div style="grid-column:span 2"><label class="field-label">Current Password</label><input class="input" type="password" /></div>
            <div><label class="field-label">New Password</label><input class="input" type="password" /></div>
            <div><label class="field-label">Confirm New Password</label><input class="input" type="password" /></div>
          </div>
          <div class="form-actions"><button class="btn btn-primary">Update Password</button></div>
        }
      }
    </div>
  </div>
</div>
