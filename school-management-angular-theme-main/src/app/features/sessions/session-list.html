<div class="page-wrap">
  <app-page-header title="Academic Sessions" subtitle="Manage academic year sessions, activation and archives." [crumbs]="[{label: 'Dashboard', link: '/dashboard'}, {label: 'Academic Sessions'}]">
    <button class="btn btn-primary"><app-icon name="plus" [size]="16" /> Create Session</button>
  </app-page-header>

  <div class="grid grid-3">
    @for (s of sessions(); track s.id) {
      <div class="card card-pad session-card" [class.active-session]="s.status === 'Active'">
        <div class="flex justify-between items-center">
          <div class="session-icon"><app-icon name="calendar" [size]="20" /></div>
          <app-status-badge [status]="s.status" />
        </div>
        <div class="font-bold" style="font-size:20px; margin-top: var(--space-4)">{{ s.label }}</div>
        <div class="text-muted text-xs" style="margin-top:4px">{{ s.startDate }} – {{ s.endDate }}</div>
        <div class="flex gap-2" style="margin-top: var(--space-5)">
          @if (s.status !== 'Active') {
            <button class="btn btn-outline btn-sm" style="flex:1">Activate</button>
          }
          <button class="btn btn-ghost btn-sm" style="flex:1"><app-icon name="eye" [size]="14" /> History</button>
        </div>
      </div>
    }
  </div>
</div>
