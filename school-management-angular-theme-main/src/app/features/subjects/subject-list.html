<div class="page-wrap">
  <app-page-header title="Subjects" subtitle="Manage subjects, curriculum type and class assignment." [crumbs]="[{label: 'Dashboard', link: '/dashboard'}, {label: 'Subjects'}]">
    <button class="btn btn-primary"><app-icon name="plus" [size]="16" /> Add Subject</button>
  </app-page-header>

  <div class="card card-pad">
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Subject</th><th>Code</th><th>Type</th><th>Assigned Classes</th><th>Status</th><th></th></tr></thead>
        <tbody>
          @for (s of subjects(); track s.id) {
            <tr>
              <td class="flex items-center gap-3">
                <div class="subject-icon"><app-icon name="book" [size]="16" /></div>
                <span class="font-semibold">{{ s.name }}</span>
              </td>
              <td class="text-secondary">{{ s.code }}</td>
              <td><app-status-badge [status]="s.type === 'Core' ? 'Active' : 'Pending'" /></td>
              <td class="text-secondary">{{ s.classIds.length }} classes</td>
              <td><span class="badge badge-success">Active</span></td>
              <td>
                <div class="flex gap-1">
                  <button class="btn btn-ghost btn-icon btn-sm"><app-icon name="edit" [size]="15" /></button>
                  <button class="btn btn-ghost btn-icon btn-sm"><app-icon name="trash" [size]="15" /></button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
