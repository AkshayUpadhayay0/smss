# Secret scan configuration (gitleaks, MIT licence). Extends the built-in rules and adds SMSS-specific ones.
# Scan the working tree:   gitleaks dir . --config .gitleaks.toml --redact
# Scan the staged changes: gitleaks git --staged --config .gitleaks.toml --redact   (the pre-commit hook does this)
# Scan all history:        gitleaks git . --config .gitleaks.toml --redact
title = "SMSS"

[extend]
useDefault = true

[[rules]]
id = "smss-connection-string-password"
description = "A connection string with a non-empty Password="
regex = '''(?i)(Host|Server)=[^;"\r\n]+;[^"\r\n]*Password=[^;"\r\n<$]{3,}'''
keywords = ["password="]
[[rules.allowlists]]
description = "documentation placeholders"
regexTarget = "match"
regexes = ['''YOUR_DB_PASSWORD''', '''Password=\.\.\.''', '''Password=REDACTED''']

[[rules]]
id = "smss-config-secret-value"
description = "A non-empty secret in a JSON config file (Jwt Key, setup key, SMTP app password)"
regex = '''(?i)"(Key|SuperAdminSetupKey|SenderAppPassword|SecretKey|SigningKey|ClientSecret|ApiKey)"\s*:\s*"[^"\s<]{8,}"'''
path = '''(?i)\.(json|config)$'''
keywords = ["superadminsetupkey", "senderapppassword", "secretkey", "signingkey", "clientsecret", "apikey", "\"key\""]
[[rules.allowlists]]
description = "markers the history rewrite left in place of the old secrets"
regexTarget = "match"
regexes = ['''REDACTED-(JWT-KEY|SETUP-KEY|SMTP-PASSWORD)''']

[[rules]]
id = "smss-database-dump"
description = "A PostgreSQL dump (password hashes and personal data): never commit"
regex = '''-- PostgreSQL database dump'''
keywords = ["postgresql database dump"]
[[rules.allowlists]]
description = "local, git-ignored dumps (Docs/smss-db*.sql); the pre-commit hook also refuses any staged dump by file name"
paths = ['''Docs/smss-db.*\.sql$''']

[allowlist]
description = "generated and third-party folders; the secrets of THIS machine live outside the repository"
paths = [
  '''(^|/)node_modules/''', '''(^|/)\.angular/''', '''(^|/)dist/''', '''(^|/)(bin|obj)/''', '''(^|/)\.vs/''',
  '''smss-api/smss-api/uploads(-private)?/''',
]
